[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.1.0"
description = "A coding-agent harness: one loop, tools, hooks, and a stop gate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"anthropic>=0.25.0",
	"python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hearth = "hearth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
